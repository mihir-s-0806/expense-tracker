spring.application.name=expense-tracker
server.port=${PORT}
#PORT=8080;SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/expensetrackerdb;SPRING_DATASOURCE_USERNAME=postgres;SPRING_DATASOURCE_PASSWORD=Mihir@123
# PostgreSQL Database Configuration (Local & Render Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.tracker.expensetracker=DEBUG
